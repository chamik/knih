---
layout: default
---

<div class="flex flex-col mt-10 text-pale">
    <p class="text-2xl text-gray-400">Série</p>
    <h2 class="text-5xl text-brown font-extrabold leading-[3.5rem]">{{ page.series }}</h2>
<p class="text-2xl text-light-brown font-bold pt-1">{{page.bookauthor}}</p>
    <article class="prose prose-xl min-w-full prose-p:my-3 text-pale prose-a:text-pale my-3">
        {{ content }}
    </article>

    {% assign posts = site.posts | where: "series", page.series | sort: "date" %}
    <div class="pb-8">
        <p class="text-lg text-gray-400 mb-3">Přečtené knihy v sérii</p>
        <ol>
        {% for post in posts %}
            <li class="flex items-baseline gap-3 text-xl py-1">
                <span class="text-pale-brown italic w-6 shrink-0">{{ forloop.index }}.</span>
                <a href="{{post.url}}" class="text-brown font-semibold underline underline-offset-4">{{post.title}}</a>
                <span class="flex-1 border-b-2 border-dotted border-dark-gray"></span>
                <span class="text-gray-500 text-base whitespace-nowrap">{{post.pages}} stran</span>
            </li>
        {% endfor %}
        </ol>
    </div>
</div>
